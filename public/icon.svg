<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Central Emblem Group -->
  <g filter="url(#dropGlow)">
    <!-- Graduation Cap Top (Rhombus) -->
    <path d="M 256 120 L 416 195 L 256 270 L 96 195 Z" fill="url(#capGrad)"/>
    
    <!-- Graduation Cap Skull/Base -->
    <path d="M 160 228 L 160 300 Q 256 360 352 300 L 352 228 Q 256 272 160 228 Z" fill="#ffffff" fill-opacity="0.92"/>

    <!-- Tassel String -->
    <path d="M 256 195 Q 390 230 405 320" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Tassel Fringe -->
    <circle cx="406" cy="326" r="10" fill="url(#goldGrad)"/>
    <path d="M 406 336 L 401 370 Q 406 374 411 370 Z" fill="url(#goldGrad)"/>

    <!-- Stylized "V" Emblem beneath Cap representing VishwaVed & Knowledge Wings -->
    <path d="M 190 355 L 256 425 L 322 355" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Orbit Science Ring for Science Academy -->
    <ellipse cx="256" cy="275" rx="180" ry="50" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 10" transform="rotate(-15 256 275)" opacity="0.85"/>
  </g>
</svg>
